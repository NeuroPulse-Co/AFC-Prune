id: s1-baselines
title: "Under one fair protocol, does corrected PGI select better filters than simple scores?"
workstream: W2
status: running
owner: [Dewmina Wijekoon]
started: 2026-11-24
summary: >-
  We compare twelve ways of choosing which convolutional filters to keep, including our corrected
  Principal Gradient Importance (PGI), at six pruning budgets and several recovery levels, on three
  separately trained models. So far, PGI beats random choice but loses to simple scores such as
  Taylor importance and weight magnitude.
question: >-
  When every selector gets the same budget, the same per-layer allocation rule and the same recovery
  step, does corrected PGI keep more validation accuracy on Conv2Net with CIFAR-10 than simple
  filter scores (L1 and L2 norm, Taylor, batch-normalisation scale, FPGM, HRank, mean activation)
  and random choice?
hypothesis: >-
  If PGI captures how filters shape the output layer's functional connectivity, it should beat the
  simple scores, most clearly when only the output layer is allowed to recover.
success_criterion: >-
  Over three dense models trained with different seeds, corrected PGI's mean validation accuracy
  change is at least as good as the best simple selector at most budgets, judged on paired
  per-seed differences, with the closed-form ridge head (tier T1r) as the headline recovery tier.
criterion: post_hoc
code: [afcprune, experiments/s1_baselines.py, experiments/run_s1.sh]
paper_targets: {conv2net_75p8_dacc: -3.78}
notes: >-
  The closed-form tiers (T0, T1r, T2r, T3r) finished on all four checkpoints on 2026-11-24. The
  gradient tiers (T1g, T1fc, T4) had started on run01_paper when the GPU server lost power around
  2026-11-25; how far they got is unknown until the server is back. The runner skips finished
  rows, so the phase can be resumed.
key_results:            # interim, closed-form tiers only
  - label: "Taylor importance, 75.8% of parameters removed, closed-form ridge head (T1r)"
    value: -8.35
    unit: "accuracy change (points)"
    split: val
    n_seeds: 3
    std: 1.40
    compare: {label: "paper (Table 5)", value: -3.78}
  - label: "Corrected PGI, same setting"
    value: -10.65
    unit: "accuracy change (points)"
    split: val
    n_seeds: 3
    std: 1.02
  - label: "Random selection (3 draws per seed), same setting"
    value: -11.39
    unit: "accuracy change (points)"
    split: val
    n_seeds: 3
    std: 1.37
  - label: "Reproduction gate: corrected PGI at (19, 16) kept, FC fine-tuning (T1fc), paper protocol"
    value: -10.47
    unit: "accuracy change (points)"
    split: test
    n_seeds: 1
    compare: {label: "cifar10-repro step 8, 3-seed mean", value: -10.50}
evidence:
  - type: diagram
    source: diagrams/method.excalidraw.svg
    title: One fair comparison of filter-selection methods
    caption: >-
      Each of three separately trained Conv2Net networks is pruned by our corrected Principal
      Gradient Importance (PGI, in blue) and by eleven comparison methods, including filter pruning
      via geometric median (FPGM) and feature-map rank (HRank). Every method gets the same budgets,
      the same rule for splitting the budget between the two layers, and the same recovery levels,
      and every pruning choice is made on validation images. The amber level, gradient
      fine-tuning, is unfinished because the GPU server lost power, so the results so far come from
      the four recovery levels that need no gradient training.
  - type: chart
    source: [results/clean_s42/results.csv, results/clean_s43/results.csv, results/clean_s44/results.csv]
    filter: {budget: 75.8, tier: T1r}
    x: selector
    y: d_acc
    x_label: How filters were chosen
    y_label: Change in validation accuracy after removing 75.8% of parameters (points)
    split: val
    labels: &selectors
      pgi_aligned: PGI, corrected
      pgi_literal: PGI, authors' formula
      taylor: Taylor importance
      bn_gamma: Batch-norm scale
      l1: Smallest weights (L1)
      l2: Smallest weights (L2)
      fpgm: Geometric median (FPGM)
      hrank: Feature-map rank (HRank)
      act_mean: Mean activation
      random_s0: Random filters
      random_s1: Random filters
      random_s2: Random filters
    reference: {label: "Paper", value: -3.78}
    title: At the paper's pruning level, corrected PGI loses to simple scores
    caption: >-
      Each dot is one of three separately trained networks; random filters have three draws per
      network. Only the final layer is refitted after pruning. Taylor importance, batch-norm scale
      and the smallest weights cluster around −8.4 to −8.8, corrected PGI averages −10.65, and
      random choice −11.39. Nothing comes near the paper's −3.78.
  - type: chart
    source: [results/clean_s42/results.csv, results/clean_s43/results.csv, results/clean_s44/results.csv]
    filter: {budget: [50.0, 70.0, 75.8, 85.0, 90.0], tier: T1r, selector: [pgi_aligned, taylor, random_s0, random_s1, random_s2]}
    x: budget
    series: selector
    y: d_acc
    x_label: Share of parameters removed
    y_label: Change in validation accuracy (points)
    split: val
    labels:
      "50.0": 50% removed
      "70.0": 70% removed
      "75.8": 75.8% removed
      "85.0": 85% removed
      "90.0": 90% removed
      pgi_aligned: PGI, corrected
      taylor: Taylor importance
      random_s0: Random filters
      random_s1: Random filters
      random_s2: Random filters
    title: The ranking holds at every pruning level
    caption: >-
      The same comparison at five pruning levels. At every level, corrected PGI sits between
      Taylor importance and random choice: better than chance, worse than a simple score. The gap
      to random is widest at 90%, where random choice loses about five points more than PGI.
  - type: table
    source: [results/clean_s42/results.csv, results/clean_s43/results.csv, results/clean_s44/results.csv]
    filter: {budget: 75.8, selector: [pgi_aligned, taylor, l1]}
    columns: {tag: Network, selector: Selection, tier: Recovery, val_acc: "Validation accuracy (%)", d_acc: "Change (points)"}
    labels:
      pgi_aligned: PGI, corrected
      taylor: Taylor importance
      l1: Smallest weights (L1)
      T0: Nothing refitted
      T1r: Final layer refitted
      T2r: + batch-norm statistics
      T3r: + next layer refitted
    split: val
    title: Cheap recovery steps barely help
    caption: >-
      Each pruned network at 75.8%, with four levels of recovery that need no gradient training.
      With nothing refitted, pruning costs 44 to 57 points. Refitting the final layer brings that
      back to between −7.4 and −11.8. Re-estimating batch-norm statistics and refitting the next
      layer then change the result by less than one point, and mostly make it slightly worse.
